name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/antiagingdna:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/antiagingdna:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 18.207.116.75
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 20022
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/antiagingdna:latest
            docker stop antiagingdna || true
            docker rm antiagingdna || true
            docker run -d --name antiagingdna -p 8080:8080 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/antiagingdna:latest
