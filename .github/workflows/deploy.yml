name: Test & Deploy

# 테스트를 배포 앞단에 둔다. 이전에는 이 워크플로가 이미지만 만들었는데, Dockerfile 이
# 실행하는 bootJar 는 test 에 의존하지 않아서 테스트가 어디서도 자동 실행되지 않았다.
# 깨진 테스트를 안고도 배포가 성공했다는 뜻이다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # runner 에는 Docker 가 기본 탑재라 Testcontainers 통합 테스트가 그대로 실행된다.
      # 개발 머신에 Docker 가 없으면 그 테스트들만 건너뛰지만, 여기서는 반드시 돈다.
      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/antiagingdna:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/antiagingdna:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 2026-08-17 사고: 서버 디스크가 꽉 차서 docker pull이 "no space left on device"로
      # 실패했는데, set -e 가 없어서 스크립트가 그대로 이어져 stop/rm/run 이 로컬에 남아있던
      # 옛 이미지로 "성공"해버렸다. GitHub Actions 는 배포를 초록불로 표시했지만 실제로는
      # 여러 차례(최소 5회) 배포가 반영되지 않았다 — set -e 로 pull 실패 시 작업 자체를
      # 실패시키고, 매 배포 끝에 안 쓰는 이미지를 정리해 디스크가 다시 차지 않게 한다.
      - uses: appleboy/ssh-action@v1
        with:
          host: 54.210.141.169
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/antiagingdna:latest
            docker stop antiagingdna || true
            docker rm antiagingdna || true
            docker run -d --name antiagingdna --network antiaging-net -p 8080:8080 --restart unless-stopped \
              -e DB_URL=${{ secrets.DB_URL }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/antiagingdna:latest
            docker image prune -a -f
