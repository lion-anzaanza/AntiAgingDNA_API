# 이 워크플로는 일회용이다. 스키마 초기화가 끝나면 파일을 삭제할 것.
name: DB 초기화 (일회용)

# 배포 DB 를 drop 후 재생성한다.
#
# ddl-auto=update 시절에 만들어진 스키마에는 폐기 컬럼(user.login_id 등)이 남아 있어
# Flyway 가 V1__init.sql 을 적용할 수 없다
# ("Found non-empty schema(s) without schema history table").
# 스키마를 비워야 Flyway 가 처음부터 적용된다.
#
# 로컬에 SSH 키가 없어도 되도록 GitHub Secrets 의 EC2_SSH_KEY 를 쓴다.
# **되돌릴 수 없으므로** 수동 실행 + 확인 문자열을 요구한다.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '배포 DB 를 삭제한다. 되돌릴 수 없다. 실행하려면 DROP 을 정확히 입력'
        required: true
        type: string

jobs:
  reset-schema:
    # 오타나 실수 클릭으로는 절대 실행되지 않게 한다
    if: inputs.confirm == 'DROP'
    runs-on: ubuntu-latest
    steps:
      - name: EC2 에서 스키마 초기화
        uses: appleboy/ssh-action@v1
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: 54.210.141.169
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DB_USERNAME,DB_PASSWORD
          script: |
            set -euo pipefail

            # 비밀번호를 -p 인자로 주면 서버의 ps 출력에 그대로 남는다. MYSQL_PWD 로 넘긴다.
            mysql_do() { docker exec -e MYSQL_PWD="$DB_PASSWORD" mysql mysql -u"$DB_USERNAME" "$@"; }

            echo "── 초기화 전 상태 ──────────────────────────────"
            mysql_do -e "SELECT table_name, table_rows FROM information_schema.tables
                         WHERE table_schema='antiagingdna' ORDER BY table_name;" || true

            echo "── 앱 컨테이너 정지 ────────────────────────────"
            # 구 이미지는 ddl-auto=update 라, 살아 있으면 drop 직후 구 스키마를 되살린다
            docker stop antiagingdna || echo "(이미 정지 상태)"

            echo "── 백업 ────────────────────────────────────────"
            BACKUP=~/antiagingdna-backup-$(date +%Y%m%d-%H%M%S).sql
            docker exec -e MYSQL_PWD="$DB_PASSWORD" mysql \
              mysqldump -u"$DB_USERNAME" --databases antiagingdna > "$BACKUP"
            test -s "$BACKUP"   # 0바이트면 여기서 실패시킨다
            echo "백업 완료: $BACKUP ($(wc -c < "$BACKUP") bytes)"

            echo "── DROP & CREATE ───────────────────────────────"
            mysql_do -e "DROP DATABASE IF EXISTS antiagingdna;
                         CREATE DATABASE antiagingdna
                           DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

            echo "── 초기화 후 상태 (비어 있어야 정상) ───────────"
            mysql_do -e "SELECT COUNT(*) AS remaining_tables FROM information_schema.tables
                         WHERE table_schema='antiagingdna';"

            echo ""
            echo "완료. 이제 main 에 push 하면 새 이미지가 배포되고 Flyway 가 V1__init.sql 을 적용한다."
            echo "앱 컨테이너는 정지 상태로 두었다 — 배포가 새로 띄운다."
