# 일회용 · 읽기 전용. 배포 검증이 끝나면 db-init.yml 과 함께 삭제할 것.
name: DB 검증 (읽기 전용 · 일회용)

# Flyway 가 V1__init.sql 을 적용했는지, 테이블이 ERD 대로 생겼는지 확인한다.
# 쓰기 작업이 전혀 없으므로 확인 문자열 가드를 두지 않는다.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: EC2 에서 스키마 확인
        uses: appleboy/ssh-action@v1
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: 54.210.141.169
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DB_USERNAME,DB_PASSWORD
          script: |
            set -uo pipefail
            mysql_do() { docker exec -e MYSQL_PWD="$DB_PASSWORD" mysql mysql -u"$DB_USERNAME" "$@"; }

            echo "── 앱 컨테이너 상태 ────────────────────────────"
            docker ps --filter name=antiagingdna --format '{{.Names}}  {{.Status}}  {{.Image}}'

            echo ""
            echo "── 컨테이너 로그 (전체 tail) ───────────────────"
            docker logs --tail 120 antiagingdna 2>&1

            echo ""
            echo "── 에러/예외만 ─────────────────────────────────"
            docker logs antiagingdna 2>&1 | grep -iE "error|exception|caused by|failed|flyway|migrat" | tail -30

            echo ""
            echo "── flyway_schema_history ───────────────────────"
            mysql_do -e "SELECT installed_rank, version, description, success, execution_time
                         FROM antiagingdna.flyway_schema_history ORDER BY installed_rank;"

            echo ""
            echo "── 테이블별 컬럼 수 (ERD: 71컬럼 / 5테이블) ────"
            mysql_do -e "SELECT t.table_name, COUNT(c.column_name) AS columns
                         FROM information_schema.tables t
                         JOIN information_schema.columns c
                           ON c.table_schema=t.table_schema AND c.table_name=t.table_name
                         WHERE t.table_schema='antiagingdna'
                         GROUP BY t.table_name ORDER BY t.table_name;"

            echo ""
            echo "── 제약 (uk_* 4 / fk_* 4 이어야 정상) ──────────"
            mysql_do -e "SELECT constraint_name, table_name, constraint_type
                         FROM information_schema.table_constraints
                         WHERE table_schema='antiagingdna'
                           AND constraint_type IN ('UNIQUE','FOREIGN KEY')
                         ORDER BY constraint_name;"

            echo ""
            echo "── enum 컬럼이 VARCHAR 인지 (네이티브 enum 금지) ──"
            mysql_do -e "SELECT COUNT(*) AS native_enum_columns
                         FROM information_schema.columns
                         WHERE table_schema='antiagingdna' AND data_type='enum';"
