spring.application.name=antiagingdna

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway 마이그레이션(db/migration)이 단일 소스다.
# validate = 엔티티 매핑과 실제 테이블이 어긋나면 부팅을 거부한다. Hibernate 가 스키마를
# 건드리지 않으므로 컬럼 삭제·개명이 조용히 무시되는 update 모드의 문제가 사라진다.
spring.jpa.hibernate.ddl-auto=validate

server.forward-headers-strategy=framework

# 오류 응답은 ApiExceptionHandler(ResponseEntityExceptionHandler 상속) 가 전부 RFC 9457
# problem+json 으로 낸다. spring.mvc.problemdetails 는 켜지 않는다 — 켜면 부트가 같은 일을
# 하는 advice 를 하나 더 등록하고, 그쪽이 @Order(0) 으로 앞서서 검증 오류를 가로챈다.

# ── 인증 ────────────────────────────────────────────────────────
# DB 자격증명과 마찬가지로 기본값을 두지 않는다. 없으면 부팅이 실패한다.
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=24h

# ── 종합점수 파라미터 (기획 §6·§7) ──────────────────────────────
# 기획 §10 이 "미결정"으로 두고 §7③ 이 분기별 재보정을 예고한 값들이다.
# 재보정 시 아래 값을 바꾸고 scoring.version 을 올린다 — daily_score.scoring_version 에
# 그 값이 기록되므로 과거 점수가 어떤 파라미터로 산출됐는지 추적된다.
scoring.version=v1.0-coldstart
# 기획 원안 30/25/20/15/10 에서 환경(상수라 변별력 없음)을 빼고 나머지를 재정규화(÷0.90).
# 원안의 상대 비율은 그대로 보존된다.
scoring.weights.physical=0.333
scoring.weights.mental=0.278
scoring.weights.emotion=0.222
scoring.weights.social=0.167
scoring.weights.environment=0.000
# α(n) = n / (n + shrinkage), 상한 cap — 기획 §7② 확정값
scoring.alpha.shrinkage=7
scoring.alpha.cap=0.95
# 표시 종합점수의 이동평균 창(일) — 기획 §7
scoring.moving-average-days=7
