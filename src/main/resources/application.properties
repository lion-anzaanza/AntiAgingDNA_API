spring.application.name=antiagingdna

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway 마이그레이션(db/migration)이 단일 소스다.
# validate = 엔티티 매핑과 실제 테이블이 어긋나면 부팅을 거부한다. Hibernate 가 스키마를
# 건드리지 않으므로 컬럼 삭제·개명이 조용히 무시되는 update 모드의 문제가 사라진다.
spring.jpa.hibernate.ddl-auto=validate

server.forward-headers-strategy=framework

# 오류 응답은 ApiExceptionHandler(ResponseEntityExceptionHandler 상속) 가 전부 RFC 9457
# problem+json 으로 낸다. spring.mvc.problemdetails 는 켜지 않는다 — 켜면 부트가 같은 일을
# 하는 advice 를 하나 더 등록하고, 그쪽이 @Order(0) 으로 앞서서 검증 오류를 가로챈다.

# ── 인증 ────────────────────────────────────────────────────────
# DB 자격증명과 마찬가지로 기본값을 두지 않는다. 없으면 부팅이 실패한다.
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=24h

# ── 종합점수 파라미터 (기획 §6·§7) ──────────────────────────────
# 기획 §10 이 "미결정"으로 두고 §7③ 이 분기별 재보정을 예고한 값들이다.
#
# 재보정 절차 — 아래 값을 바꾸고 scoring.version 을 반드시 함께 올린다.
# 배포되면 각 사용자가 점수를 처음 조회할 때 그 사람의 이력 전체가 새 파라미터로 다시
# 산출된다(ScoringService.rescore). 버전을 올리지 않으면 옛 점수가 그대로 남아 신·구
# 파라미터 결과가 한 그래프에 섞인다.
scoring.version=v1.1-stress-0to10
# v1.1: stressLevel 도메인을 1~10 에서 0~10 으로 확장 (FE backend-backlog.md #7,
# docs/PLANNING_OPEN_ITEMS.md A-6, 2026-08-17 결정). ItemScores.stress() 분모 9→10.
# 기존 저장 점수는 ScoringService.rescore 가 다음 조회 시 자동 재계산한다.
# 기획 원안 30/25/20/15/10 에서 환경(상수라 변별력 없음)을 빼고 나머지를 재정규화(÷0.90).
# 원안의 상대 비율은 그대로 보존된다.
scoring.weights.physical=0.333
scoring.weights.mental=0.278
scoring.weights.emotion=0.222
scoring.weights.social=0.167
scoring.weights.environment=0.000
# α(n) = n / (n + shrinkage), 상한 cap — 기획 §7② 확정값
scoring.alpha.shrinkage=7
scoring.alpha.cap=0.95
# 표시 종합점수의 이동평균 창(일) — 기획 §7
scoring.moving-average-days=7

# 점수(0~100) → 3단계 등급(좋음/주의/위험) 경계값 — 2026-08-17 결정
# (FE backend-backlog.md #22, docs/PLANNING_OPEN_ITEMS.md B-4). 70점 이상 좋음,
# 40~69 주의, 40 미만 위험. 표시 전용 값이라 바뀌어도 scoring.version 을 올리지
# 않는다 — 저장하지 않고 매 요청마다 다시 계산한다.
scoring.grade.good-min=70
scoring.grade.warn-min=40

# 개발용 시드 계정(FE backend-backlog.md #17, 2026-08-17 결정) — DemoAccountSeeder 참고.
# 이미 있으면 다시 심지 않는다. 끄려면 false.
app.seed-demo.enabled=true
